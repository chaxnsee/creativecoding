<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>RED RED GREEN GREEN</title>
    <style>
        body { margin: 0; padding: 0; background: #000; color: #fff; font-family: sans-serif; overflow: hidden; }
        #app { width: 100%; height: 100vh; position: relative; max-width: 500px; margin: 0 auto; background: #111; display: flex; flex-direction: column; }
        canvas { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        video { display: none; }
        .screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 10; background: rgba(0,0,0,0.85); opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .screen.active { opacity: 1; pointer-events: auto; }
        .btn { background: #333; color: #fff; border: 1px solid #666; padding: 15px 30px; font-size: 1.2rem; cursor: pointer; border-radius: 5px; margin-top: 20px; font-family: sans-serif; font-weight: bold; }
        .btn:active { background: #555; }
        .btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .hud { position: absolute; bottom: 20px; right: 20px; z-index: 5; display: none; }
        .small-btn { padding: 10px 20px; font-size: 1rem; background: #222; }
        .small-btn.recording { background: #ff3333; color: white; border-color: #ff3333; }
        h1, h2 { margin: 0 0 10px 0; font-size: 2rem; }
        .instructions { text-align: center; margin-bottom: 20px; line-height: 1.8; color: #ccc; }
        #recorded-video-container { width: 80%; text-align: center; margin-bottom: 20px; }
        video#replay-video { width: 100%; border: 1px solid #444; }
    </style>
</head>
<body>
    <div id="app">
        <canvas id="output-canvas"></canvas>
        <video id="webcam" autoplay playsinline muted></video>

        <div id="start-screen" class="screen active">
            <h1>RED RED GREEN GREEN</h1>
            <div class="instructions" style="margin-bottom: 10px; color:#fff;">inspired by CORTIS</div>
            <div class="instructions">
                <div><strong style="color:#ff3333;">RED RED:</strong> Cross Arms</div>
                <div><strong style="color:#33ff33;">GREEN GREEN:</strong> Hands aligned with ears</div>
            </div>
            <button id="start-btn" class="btn">START CAMERA</button>
        </div>

        <div id="game-ui-overlay" class="hud">
            <button id="record-btn" class="btn small-btn">RECORD</button>
        </div>

        <div id="result-screen" class="screen">
            <h2>COMPLETE</h2>
            <div style="margin-bottom: 20px; font-size: 1.2rem; line-height: 1.5; text-align: center;">
                <div>SCORE: <span id="final-score">0</span></div>
                <div>MAX COMBO: <span id="max-combo">0</span></div>
            </div>
            <div id="recorded-video-container" style="display:none;">
                <video id="replay-video" controls playsinline loop></video>
            </div>
            <button id="restart-btn" class="btn">RESTART</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
