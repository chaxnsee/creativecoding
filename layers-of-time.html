<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>The Layers of Time — AR Exhibition</title>
<meta name="description" content="Four augmented reality experiences. Gallery Ohmmar, Yangon — 20 September 2026.">
<meta name="theme-color" content="#150A0A">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Jost:wght@300;400;500&family=Padauk:wght@400;700&family=Noto+Sans+Myanmar:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --lacquer:#150A0A;        /* thitsi black-red ground */
    --lacquer-deep:#0C0505;
    --vitrine:#1F0F0E;        /* panel */
    --gold:#E3C27E;
    --gold-hi:#FFF4D2;
    --gold-lo:#8A6A2C;
    --silver:#CFD6DC;
    --silver-lo:#6E7780;
    --paper:#EDE3D6;
    --paper-dim:#A79A8C;

    --edge:rgba(227,194,126,.20);
    --edge-soft:rgba(227,194,126,.10);

    --font-en-display:'Marcellus', Georgia, serif;
    --font-en-body:'Jost', system-ui, sans-serif;
    --font-my-display:'Padauk', 'Noto Sans Myanmar', sans-serif;
    --font-my-body:'Noto Sans Myanmar', 'Padauk', sans-serif;

    --display:var(--font-en-display);
    --body:var(--font-en-body);
    --lh-body:1.6;
  }
  html[lang="my"]{
    --display:var(--font-my-display);
    --body:var(--font-my-body);
    --lh-body:2.0;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(120% 70% at 50% -10%, #2A1412 0%, var(--lacquer) 45%, var(--lacquer-deep) 100%)
      fixed;
    color:var(--paper);
    font-family:var(--body);
    font-weight:300;
    line-height:var(--lh-body);
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:5;opacity:.30;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
  }

  .wrap{max-width:640px;margin:0 auto;padding:0 22px 72px}

  /* ── language switch ───────────────────────────── */
  .lang{
    position:sticky;top:0;z-index:10;
    display:flex;justify-content:flex-end;gap:2px;
    padding:14px 0 10px;
    backdrop-filter:blur(6px);
  }
  .lang button{
    font-family:var(--font-en-body);
    font-size:12px;letter-spacing:.06em;
    color:var(--silver-lo);
    background:transparent;
    border:1px solid var(--edge-soft);
    padding:7px 13px;
    cursor:pointer;
    transition:color .25s, border-color .25s, background .25s;
  }
  .lang button:first-child{border-right:0}
  .lang button[data-my]{font-family:var(--font-my-body);font-size:13px}
  .lang button[aria-pressed="true"]{
    color:var(--lacquer);
    background:linear-gradient(120deg,var(--silver-lo),var(--silver) 45%,#fff 55%,var(--silver) 70%,var(--silver-lo));
    border-color:transparent;
  }
  .lang button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

  /* ── hero ──────────────────────────────────────── */
  header{padding:34px 0 8px;text-align:center}
  .kicker{font-size:13px;letter-spacing:.14em;color:var(--paper-dim);margin:0 0 26px}
  html[lang="my"] .kicker{letter-spacing:0;font-size:14px}

  .title{
    position:relative;
    font-family:var(--display);
    font-weight:400;
    font-size:clamp(34px,10.5vw,58px);
    line-height:1.12;
    letter-spacing:.01em;
    margin:0;
    color:transparent;
    background:linear-gradient(96deg,var(--gold-lo) 0%,var(--gold) 28%,var(--gold-hi) 45%,var(--gold) 62%,var(--gold-lo) 100%);
    background-size:220% 100%;
    -webkit-background-clip:text;background-clip:text;
    animation:sheen 11s linear infinite;
  }
  html[lang="my"] .title{font-size:clamp(28px,8vw,46px);line-height:1.5}
  .title .echo{
    position:absolute;inset:0;
    color:var(--gold);
    -webkit-text-fill-color:currentColor;
    opacity:0;filter:blur(2px);
    pointer-events:none;
  }
  .title .echo:nth-child(1){animation:layer1 2.4s cubic-bezier(.2,.7,.2,1) forwards}
  .title .echo:nth-child(2){color:var(--silver);animation:layer2 2.4s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes layer1{0%{opacity:.55;transform:translate(-14px,10px) scale(1.05)}100%{opacity:.08;transform:none}}
  @keyframes layer2{0%{opacity:.45;transform:translate(13px,-9px) scale(.97)}100%{opacity:.07;transform:none}}
  @keyframes sheen{to{background-position:220% 0}}

  .venue{margin:22px auto 0;max-width:34ch;font-size:14px;color:var(--paper-dim)}
  .venue span{display:block}
  .venue .date{color:var(--silver);margin-top:4px}

  .rule{height:1px;margin:38px 0;background:linear-gradient(90deg,transparent,var(--edge) 20%,var(--edge) 80%,transparent)}

  /* ── before you start ──────────────────────────── */
  .primer{margin:0 0 40px}
  .primer h2{font-family:var(--display);font-weight:400;font-size:19px;color:var(--gold);margin:0 0 16px;letter-spacing:.02em}
  .primer ol{margin:0;padding:0;list-style:none;counter-reset:step}
  .primer li{position:relative;padding:0 0 14px 30px;font-size:15px;color:var(--paper-dim)}
  .primer li::before{
    counter-increment:step;content:counter(step);
    position:absolute;left:0;top:0;
    font-family:var(--font-en-body);font-size:12px;color:var(--gold-lo);line-height:inherit;
  }

  /* ── vitrines ──────────────────────────────────── */
  .scene{
    position:relative;
    background:linear-gradient(180deg,var(--vitrine),rgba(31,15,14,.35));
    border:1px solid var(--edge-soft);
    padding:24px 22px 24px;
    margin:0 0 22px;
  }
  .scene::before,.scene::after{
    content:"";position:absolute;width:14px;height:14px;pointer-events:none;
    border:1px solid var(--gold);opacity:.5;
  }
  .scene::before{top:-1px;left:-1px;border-right:0;border-bottom:0}
  .scene::after{bottom:-1px;right:-1px;border-left:0;border-top:0}

  .head{display:flex;gap:18px;align-items:flex-start;margin-bottom:16px}
  .preview{
    position:relative;flex:none;
    width:106px;aspect-ratio:4/5;
    border:1px solid var(--edge);
    background:#0A0505;
    overflow:hidden;
  }
  .preview img{width:100%;height:100%;object-fit:cover;display:block}
  /* containment glass over the loop */
  .preview::after{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:
      linear-gradient(180deg,rgba(21,10,10,.35),transparent 30%,transparent 72%,rgba(21,10,10,.45)),
      repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 1px,transparent 1px 3px);
  }
  .head-text{min-width:0;padding-top:2px}
  .num{font-family:var(--font-my-body);font-size:13px;color:var(--gold-lo);display:block;margin-bottom:6px;line-height:1.2}
  .scene h3{
    font-family:var(--display);font-weight:400;
    font-size:clamp(21px,5.8vw,26px);line-height:1.25;
    margin:0;
    color:transparent;
    background:linear-gradient(100deg,var(--silver-lo),var(--paper) 30%,#fff 46%,var(--gold) 68%,var(--gold-lo));
    background-size:180% 100%;
    -webkit-background-clip:text;background-clip:text;
  }
  html[lang="my"] .scene h3{line-height:1.6}
  .scene p{margin:0 0 22px;font-size:15px;color:var(--paper-dim);max-width:46ch}

  .actions{display:flex;flex-direction:column;gap:10px}
  .btn{
    display:block;text-align:center;text-decoration:none;
    font-family:var(--body);font-size:14px;letter-spacing:.04em;
    padding:14px 16px;
    color:var(--lacquer-deep);
    background-size:240% 100%;background-position:0 0;
    transition:background-position .8s ease, transform .2s ease, filter .3s ease;
  }
  html[lang="my"] .btn{letter-spacing:0;font-size:15px;padding:12px 16px}
  .btn-gold{background-image:linear-gradient(110deg,var(--gold-lo) 0%,var(--gold) 26%,var(--gold-hi) 42%,var(--gold) 58%,var(--gold-lo) 100%)}
  .btn-silver{background-image:linear-gradient(110deg,#5C666E 0%,var(--silver) 30%,#FFFFFF 46%,var(--silver) 62%,#5C666E 100%)}
  .btn:hover,.btn:focus-visible{background-position:100% 0;filter:brightness(1.06)}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--gold-hi);outline-offset:3px}

  footer{margin-top:44px;text-align:center;font-size:13px;color:var(--silver-lo)}
  footer p{margin:0 0 6px}

  @media (min-width:420px){
    .preview{width:124px}
  }
  @media (min-width:560px){
    .actions{flex-direction:row}
    .actions .btn{flex:1}
  }
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation:none!important;transition:none!important}
    .title .echo{opacity:.08}
  }
</style>
</head>
<body>
<div class="wrap">

  <nav class="lang" aria-label="Language">
    <button type="button" data-set="en" aria-pressed="true">English</button>
    <button type="button" data-set="my" data-my aria-pressed="false">မြန်မာ</button>
  </nav>

  <header>
    <p class="kicker" data-i18n="kicker"></p>
    <h1 class="title">
      <span class="echo" aria-hidden="true" data-i18n="title"></span>
      <span class="echo" aria-hidden="true" data-i18n="title"></span>
      <span data-i18n="title"></span>
    </h1>
    <p class="venue">
      <span data-i18n="venue"></span>
      <span class="date" data-i18n="date"></span>
    </p>
  </header>

  <div class="rule"></div>

  <section class="primer">
    <h2 data-i18n="primerTitle"></h2>
    <ol>
      <li data-i18n="step1"></li>
      <li data-i18n="step2"></li>
      <li data-i18n="step3"></li>
    </ol>
  </section>

  <main id="scenes"></main>

  <footer>
    <p data-i18n="footNote"></p>
    <p data-i18n="credit"></p>
  </footer>
</div>

const scenesEl = document.getElementById('scenes');

function render(lang){
  const t = T[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-i18n]').forEach(el => {
    el.textContent = t[el.dataset.i18n];
  });
  document.querySelectorAll('.lang button').forEach(b => {
    b.setAttribute('aria-pressed', String(b.dataset.set === lang));
  });

  scenesEl.innerHTML = SCENES.map(s => `
    <article class="scene">
      <div class="head">
        <div class="preview"><img src="${s.gif}" alt="${s[lang].title}" loading="lazy" decoding="async"></div>
        <div class="head-text">
          <span class="num">${s.n}</span>
          <h3>${s[lang].title}</h3>
        </div>
      </div>
      <p>${s[lang].body}</p>
      <div class="actions">
        <a class="btn btn-gold" href="${s.lens}" target="_blank" rel="noopener">${t.lens}</a>
        <a class="btn btn-silver" href="${s.web}" target="_blank" rel="noopener">${t.web}</a>
      </div>
    </article>
  `).join('');

  document.title = t.title + ' — ' + t.venue;
}

document.querySelectorAll('.lang button').forEach(b => {
  b.addEventListener('click', () => render(b.dataset.set));
});

render('en');
</script>
